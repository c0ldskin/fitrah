name: Fitrah Cloud Laboratory - Stage 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Initialize artifact location
        run: echo "OUTPUT=${RUNNER_TEMP}/fitrah-stage1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; see docs/cloud-laboratory.md
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Stage 1 and automation regression tests
        id: tests
        run: python -m pytest -q tests/test_stage1.py tests/test_stage1_ci.py --basetemp="${RUNNER_TEMP}/stage1-regression-diagnostics" --junitxml="${RUNNER_TEMP}/stage1-tests.xml"
      - name: Execute canonical Stage 1 and independently verify six logs
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: python scripts/run_stage1_ci.py --output "$OUTPUT"
      - name: Preserve test report and summarize outcomes
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p "$OUTPUT"
          if [ -f "${RUNNER_TEMP}/stage1-tests.xml" ]; then
            cp "${RUNNER_TEMP}/stage1-tests.xml" "$OUTPUT/"
          fi
          python scripts/summarize_stage1_ci.py --output "$OUTPUT" --tests-outcome "$TESTS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
      - name: Upload controlled-failure regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage1-regression-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage1-regression-diagnostics/
          if-no-files-found: error
          retention-days: 90
