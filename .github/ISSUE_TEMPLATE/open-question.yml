name: 🔍 Open question
description: A research question Fitrah hasn't answered yet.
labels: ["open question"]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: One clear question. Link the OQ number from research/open-questions.md if it has one.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Which hypothesis, invariant or claim depends on the answer?
  - type: textarea
    id: approach
    attributes:
      label: Possible approaches or prior art
